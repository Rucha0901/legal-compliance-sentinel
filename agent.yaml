spec_version: "0.1.0"
name: legal-compliance-sentinel
version: 1.0.0
description: Enterprise contract auditing, gdpr/hipaa compliance clause review, and legal risk scoring.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - clause-risk-scoring
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - compliance
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/legal-compliance-sentinel"
